micronaut.server.port=8703
datasources.default.url=jdbc:postgresql://localhost:5432/postgres
datasources.default.username=postgres
datasources.default.password=password
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.dialect=POSTGRES
jpa.default.properties.hibernate.show_sql=true

## Hibernate Properties
jpa.default.entity-scan.packages=io.containerapps.javaruntime.workshop.springboot
jpa.default.properties.hibernate.bytecode.provider=none

# Hibernate ddl auto (create, create-drop, validate, update)
jpa.default.properties.hibernate.hbm2ddl.auto=create-drop

## Jackson Properties
jackson.serialization.write-dates-as-timestamps=false
jackson.serialization.write-durations-as-timestamps=false
jackson.serialization-inclusion=ALWAYS
